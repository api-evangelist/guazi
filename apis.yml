name: Guazi
description: 'Guazi is a China-based used-car export, auction, and trading platform
  founded in 2015 and headquartered in Beijing. It connects international dealers and
  buyers with used vehicles sourced across China, offering sealed-bid online auctions,
  Buy It Now direct sales, a 200-plus-point vehicle inspection process, direct sourcing
  on request, and global logistics shipping to more than 50 countries via container
  and Ro-Ro. Backed by SoftBank Vision Fund, HongShan (Sequoia China), and Tencent,
  Guazi handles over 200,000 vehicles annually. This API Evangelist profile currently
  tracks the company''s public web presence; no public developer program, API, or
  SDK has been found.'
